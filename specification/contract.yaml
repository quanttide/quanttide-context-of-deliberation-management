# 议事档案标本契约 v0.0.6
# 从实际议事档案中发现结构，固化下来形成标本
# 五环节为系统固定骨架；议题分研讨（开放深度讨论）与提案（封闭决策）两类模式
# 议事规则、议程、决议均为独立实体，不混入议题类型

spec_version: 0.0.6

name: 议事档案
description: |
  记录团队集体决策过程的知识库，以议题为单位，按时间（年份+周次）组织。
  本质是"标本"——从真实决策过程中发现结构，固化下来供后续验证和复用。
  核心理念："发现而非发明"——模型从资产中长出，不是预设的模板。
  架构原则：五节点生命周期是系统固定骨架（不可变）；议事规则、议程、决议为独立实体；
  议题只有两类模式——研讨（开放深度讨论）与提案（封闭决策），
  对五个环节的要求（required/optional/skipped）是配置层，可按需求调整。

structure:
  root: 议事档案
  metadata:
    - 首页（议事活动和编号规则）
  children:
    - name: 议事规则
      description: 常驻的议事规则配置，定义议事如何进行，非一次性议题
      fields:
        - 规则内容
        - 版本
        - 修订记录
        - 生效状态
      management: |
        规则库统一管理（版本化、可追溯）。
        规则修订经议事流程（决策/提案审计类议题）产出后更新规则库。
    - name: 议程
      description: 会议的骨架，组织多个议题，非议题类型
      fields:
        - 时间
        - 参与者
        - 议程项（关联议题列表）
      source: 会议创建时编排（meeting 组件）；议程项可关联议题、@提及行动项
    - name: 议题
      description: 集体讨论的过程记录，按模式区分（研讨/提案）
      types:
        - name: 研讨
          description: 开放深度讨论；附议环节承载多轮开放讨论，结论可选
          expected_fields:
            - 动议区（研讨主题、框架）
            - 附议区（开放讨论：多方补充、深度意见）
            - 决议区（可选：研讨结论）
          lifecycle_node: 附议扩散
          stage_requirements:
            议题创建: required
            动议提出: required
            附议扩散: required
            决议形成: optional
            归档沉淀: required
        - name: 提案
          description: 封闭决策；动议-附议-决议简洁路径，无开放式讨论
          expected_fields:
            - 元数据区（申请人、审议人）
            - 动议区（提案内容、选项、准则）
            - 附议区（封闭表态：附议/反对/弃权）
            - 决议区（最终决定）
          lifecycle_node: 决议形成
          stage_requirements:
            议题创建: required
            动议提出: required
            附议扩散: required
            决议形成: required
            归档沉淀: required
    - name: 决议
      description: 议事的结果，独立于议题单独管理，方便统一治理
      source: 议题"决议形成"节点产出的决议实体（或直接创建决议）
      fields:
        - 决议内容
        - 投票结果（如有）
        - 责任人
        - 完成期限
        - 执行状态（待执行/执行中/已完成/逾期）
        - 关联议题
      management: |
        所有决议进入决议档案统一管理：
        - 执行跟踪与逾期预警
        - 治理审计（决议是否被有效执行、执行质量）
        - 统计视图（决议数量、完成率、逾期率）

lifecycle:
  fixed_skeleton: true
  note: |
    五节点（议题创建 → 动议提出 → 附议扩散 → 决议形成 → 归档沉淀）为系统固定骨架，不可变。
    议题两类模式：研讨（附议环节开放深度讨论，决议可选）与提案（封闭决策，动议-附议-决议简洁路径，不设开放式讨论）。
    具体规则由各模式对五环节的 stage_requirements 配置：required（必经）、optional（可跳过）、skipped（不适用）。
    决议形成节点产出的决议实体脱离议题，进入决议档案单独管理（见 structure.children.决议）。
    议事规则与议程为独立实体，不参与议题生命周期（规则修订经提案议题产出；议程由会议编排）。
  nodes:
    - 议题创建: 新议题按类型选择模板，填写元数据
    - 动议提出: 在动议区填写核心内容（目标/选项/问题等）
    - 附议扩散: 相关人在附议区表态或补充（是否必经由类型配置决定）
    - 决议形成: 在决议区记录最终决定（是否必经由类型配置决定）；产出的决议实体进入决议档案单独管理
    - 归档沉淀: 完成记录，存入知识库

purpose:
  - 沉淀组织记忆，避免"人走知识散"
  - 支持决策可追溯，清楚"这个决定是怎么来的"
  - 提炼集体智慧，形成可复用的决策模式

business_process:
  # 预期的业务流程，AI 用来反推验证
  流程节点:
    - 议题创建: 新议题按类型选择模板
    - 动议提出: 动议区填写核心提案
    - 附议扩散: 相关人表态（按类型配置）
    - 决议形成: 拍板决定（按类型配置）；决议实体进入决议档案
    - 归档沉淀: 存入知识库
  独立实体:
    - 议事规则: 规则库版本化管理，修订经议事流程产出
    - 议程: 会议创建时编排，议程项关联议题
    - 决议: 决议档案统一治理
  反推验证: |
    AI 将实际文档内容与此处定义的预期流程对照，
    检查实际走了几步、缺了哪步、多余了哪些，
    并对照各类型的 stage_requirements 检查环节要求是否与实际一致。

validation:
  mode: SCOPED
  scope: "议事档案/**"
  policies:
    - selector: "**"
      mode: SCOPED
      required_categories:
        - 议题
        - 动议区
      optional_categories:
        - 附议区
        - 决议区
        - 元数据区
        - 个人心得
        - 准则
        - 权衡
        - 决定
