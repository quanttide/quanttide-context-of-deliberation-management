title: 【已废止】建立各部门GTD清单
content: '【已废止】建立各部门GTD清单

  提案人：

  等级：重要议题

  备注：已废止

  - 分区：原分区方案太复杂，实际上没有执行。

  - 层级：个人清单和部门清单合并到公司清单，只维护一张清单以减少维护压力。

  ---

  ~~为规范文档整理，方便秘书处跟踪部门情况以及方便工作交接，建立各部门GTD清单。~~

  ~~各部门GTD清单和部门周报一起纳入每周汇报范围。~~

  清单主要内容为以下几个区：收集区，加工区，清单区，工作区、回顾区。

  收集区：原始资料，可以比较混乱

  ~~加工区：原始资料经过个人的初步梳理，存在一定模糊头绪，但是难以落地推动。~~

  清单区：一系列事务，或者是一个还无法执行的节点，而非单个事务。

  ~~工作区：下一步需要立即执行的事务。可以分为高中低优先级。~~

  ~~回顾区：个人非正式复盘。~~

  ~~个人级：落实到个人的具体事务。个人需要部门协作部分提交到部门清单并且设置任务以及@相关人~~

  ~~部门级：清单区需要按照项目来进行分类。工作区按照项目分类来分配任务并且指定到相关负责人~~

  ~~公司级：公司业务、跨部门协作~~

  ~~个人：~~

  ~~部门：~~

  公司：'
